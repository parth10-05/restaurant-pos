version: '3.8'

services:
  # AI Microservice
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-ai-service:latest
    container_name: restaurant-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RANDOM_SEED=${RANDOM_SEED:-42}
      - FORECAST_HORIZON_DAYS=${FORECAST_HORIZON_DAYS:-30}
      - CONFIDENCE_LEVEL=${CONFIDENCE_LEVEL:-0.95}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-1000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - restaurant-network
    volumes:
      - ai-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Optional: Development service with hot reload
  ai-service-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-ai-service:dev
    container_name: restaurant-ai-service-dev
    profiles:
      - development
    ports:
      - "${AI_SERVICE_DEV_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - restaurant-network

networks:
  restaurant-network:
    driver: bridge
    name: restaurant-pos-network

volumes:
  ai-data:
    name: restaurant-ai-data
